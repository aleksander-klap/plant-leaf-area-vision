[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-leaf-area"
version = "0.1.0"
description = "Leaf area of potted plants from side photos: plant segmentation and optical mass."
requires-python = ">=3.11"
dependencies = ["numpy>=2", "opencv-python-headless>=4.8"]

[project.scripts]
plant-leaf-area = "plant_leaf_area.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
